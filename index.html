<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dungeons without dragons</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="./styles.css" />
    <script type="importmap">
      {
        "imports": {
          "ai": "./ai.js",
          "storage": "./storage.js",
          "ui": "./ui.js",
          "coordinator": "./coordinator.js",
          "modals": "./modals.js",
          "commands": "./commands.js",
          "events": "./events.js",
          "firebase-socket": "./firebase-socket.js",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
          "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="app">
      <aside id="sidebar">
        <div id="toast-container"></div>
        <div class="header">
        </div>

        <section id="you">
          <div class="section-header">
            <h2>Your Character</h2>
            <button id="btn-customise" class="small-btn">Customise</button>
          </div>
          <div id="you-card" class="card">
            <img id="you-avatar" class="avatar" src="" alt="Your avatar" />
            <div class="you-meta">
              <div class="you-name" id="you-name">You</div>
              <div class="you-location" id="you-location">-</div>
            </div>
          </div>
          <div class="stats">
            <div>HP: <span id="you-hp">-</span></div>
            <div>STR: <span id="you-str">-</span></div>
            <div>INT: <span id="you-int">-</span></div>
            <div>DEX: <span id="you-dex">-</span></div>
            <div>CHA: <span id="you-cha">-</span></div>
          </div>
          <div class="inv">
            <h3>Inventory</h3>
            <ul id="you-inv"></ul>
          </div>
          <div class="desc-section">
            <h3>Description</h3>
            <div id="you-desc" class="desc-text">(empty)</div>
          </div>
          <div class="actions" id="sidebar-actions">
            <button id="btn-look" class="warning">Look</button>
            <button id="btn-skip" class="warning" title="Pass your turn to the next player">Skip</button>
            <button id="btn-copy-char" title="Copy your character data">Copy Char</button>
            <button id="btn-load-char" class="danger" title="Load character data from clipboard">Load Char</button>
            <button id="btn-copy" title="Copy full game state">Copy Story</button>
            <button id="btn-load" class="danger" title="Load story and characters from clipboard">Load Story</button>
            <button id="btn-reset" class="danger" title="Reset your character stats">Reset Char</button>
            <button id="btn-reset-all" class="danger" title="Clears the shared story and resets all players">Reset Story</button>
          </div>
        </section>

        <section id="players">
          <h2>Players</h2>
          <div id="player-list"></div>
        </section>

        <section id="world">
          <h2>World</h2>
          <div id="world-meta"></div>
          <label class="toggle">
            <input type="checkbox" id="toggle-yesman" />
            <span>yesman Mode</span>
          </label>
          <div class="take-turn-container">
            <button id="btn-take-turn" class="small-btn">Take Turn</button>
          </div>

          <div class="collapsible-container" id="user-settings">
            <button class="collapsible-trigger" id="btn-settings-toggle">User Settings ▼</button>
            <div class="collapsible-content" id="settings-content">
              <div class="form-group">
                <label>Username Override</label>
                <input type="text" id="set-username" placeholder="Guest" maxlength="20" />
              </div>
              <div class="form-group">
                <label>Avatar URL</label>
                <input type="text" id="set-avatar" placeholder="https://..." />
              </div>
              <div class="centered-btn-wrapper">
                <button id="btn-save-settings">Update Profile</button>
              </div>
            </div>
          </div>

          <div class="collapsible-container" id="tunnel-settings">
            <button class="collapsible-trigger" id="btn-tunnel-toggle">Tunnel Settings ▼</button>
            <div class="collapsible-content" id="tunnel-content">
              <div class="form-group">
                <label>Kobold Tunnel URL</label>
                <input type="text" id="set-tunnel-url" placeholder="https://..." />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Max Tokens (Turn)</label>
                  <input type="number" id="set-max-tokens-turn" placeholder="1024" min="64" max="4096" />
                </div>
                <div class="form-group">
                  <label>Max Tokens (Intro)</label>
                  <input type="number" id="set-max-tokens-intro" placeholder="512" min="64" max="2048" />
                </div>
              </div>
              <div class="centered-btn-wrapper">
                <button id="btn-apply-tunnel">Apply Settings</button>
              </div>
            </div>
          </div>
        </section>
      </aside>

      <main id="main">
        <div id="narrative-log"></div>
        <form id="command-form" autocomplete="off">
          <input id="command-input" type="text" placeholder="Type your action (e.g., go north, talk to guard, pick up key)..." />
          <button type="submit">Send</button>
        </form>
      </main>
    </div>

    <div id="customise-modal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <h3>Customise Character</h3>
        <form id="customise-form">
          <div class="form-group">
            <label>Name (Max 20 chars)</label>
            <input type="text" id="cust-name" maxlength="20" required />
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Current HP</label>
              <input type="number" id="cust-hp" min="0" max="999" />
            </div>
            <div class="form-group">
              <label>Max HP</label>
              <input type="number" id="cust-maxhp" min="1" max="999" />
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>STR</label>
              <input type="number" id="cust-str" min="1" max="99" />
            </div>
            <div class="form-group">
              <label>INT</label>
              <input type="number" id="cust-int" min="1" max="99" />
            </div>
            <div class="form-group">
              <label>DEX</label>
              <input type="number" id="cust-dex" min="1" max="99" />
            </div>
            <div class="form-group">
              <label>CHA</label>
              <input type="number" id="cust-cha" min="1" max="99" />
            </div>
          </div>
          <div class="form-group">
            <label>Inventory (One item per line: "Item Name xQty")</label>
            <textarea id="cust-inv" rows="5" placeholder="Iron Sword x1&#10;Potion x3"></textarea>
          </div>
          <div class="form-group">
            <label>Description</label>
            <textarea id="cust-desc" rows="3" placeholder="A short description of your character..."></textarea>
          </div>
          <div class="modal-actions">
            <button type="button" id="btn-cust-cancel">Cancel</button>
            <button type="submit" id="btn-cust-save">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <div id="dice-overlay" aria-hidden="true">
      <div class="dice-panel">
        <div class="dice-title">
          <span class="dice-label">Rolling d20</span>
          <span class="dice-roller" id="dice-roller-name"></span>
        </div>
        <div class="dice-face">
          <div class="dice-number" id="dice-number">20</div>
        </div>
        <div class="dice-sub" id="dice-subtext">Get ready...</div>
      </div>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
